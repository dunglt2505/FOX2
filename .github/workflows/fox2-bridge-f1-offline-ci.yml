name: FOX2 Bridge F1 offline code and tests
on:
  push:
    branches:
      - work/FOX2-BRIDGE-F1-CHAT-DIRECT-INTEGRATED-20261021
      - work/FOX2-BRIDGE-RESTART-CONTINUATION-20261023
      - work/FOX2-BRIDGE-GIT-DELIVERY-CHAT-CI-VERIFY-20261023
    paths:
      - 'agent_bridge/**'
      - '.github/workflows/fox2-bridge-f1-offline-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fox2-bridge-f1-offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-windows-tests:
    name: Isolated Windows source validation
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout immutable commit without write token persistence
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Pin Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Report exact source SHA and verify safe workspace
        shell: pwsh
        run: |
          $sha = (git rev-parse HEAD).Trim()
          if ($sha -cne '${{ github.sha }}') { throw 'STOP: Actions source drift' }
          $bridgeTree = (git rev-parse 'HEAD:agent_bridge').Trim()
          if ($bridgeTree -cne '922db7077737f47d03537f475ffbc70520dec37a') {
            throw 'STOP: PR26 exact agent_bridge source tree mismatch'
          }
          Write-Host "PR26_AGENT_BRIDGE_TREE_VERIFIED=$bridgeTree"
          if (git status --porcelain) { throw 'STOP: Checkout not clean' }
          Write-Host "OFFLINE_SOURCE_SHA=$sha"
          Write-Host 'INSTALLED_BRIDGE=NOT_ACCESSED'
      - name: Install offline-test dependencies in runner environment
        run: python -m pip install -e './agent_bridge[dev]'
      - name: Prepare isolated C-drive owner-layout fixture for legacy path-bound tests
        shell: pwsh
        run: |
          if ($env:RUNNER_OS -cne 'Windows') { throw 'STOP: Windows runner required' }
          New-Item -ItemType Directory -Force 'C:\Projects' | Out-Null
          if (Test-Path -LiteralPath 'C:\Projects\FOX2') {
            throw 'STOP: Fixture path unexpectedly exists'
          }
          git worktree add --detach 'C:\Projects\FOX2' HEAD
          if ($LASTEXITCODE -ne 0) { throw 'STOP: Git fixture worktree failed' }
          $source = (git -C 'C:\Projects\FOX2' rev-parse HEAD).Trim()
          if ($source -cne '${{ github.sha }}') { throw 'STOP: Fixture commit SHA drift' }
          $dirty = @(git -C 'C:\Projects\FOX2' status --porcelain)
          if ($LASTEXITCODE -ne 0 -or $dirty.Count -ne 0) {
            throw 'STOP: owner-layout fixture not clean'
          }
          Write-Host 'OWNER_LAYOUT_FIXTURE=CI_ONLY_CLEAN_NO_BRIDGE_RUNTIME'

      - name: Parse Git Delivery read-only Owner host intake (NO HOST EXECUTION)
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            'docs/agent_handoff/FOX2-BRIDGE-RC1-TO-INTERNAL-READY/git_delivery/owner_host_git_delivery_readonly_v1.ps1',
            [ref]$tokens, [ref]$errors)
          if (@($errors).Count -gt 0) { throw 'STOP: physical host intake script syntax invalid' }
          Write-Host 'FOX2_GIT_DELIVERY_HOST_READONLY_SYNTAX=PASS'
          Write-Host 'OWNER_PHYSICAL_HOST_INTAKE=NOT_RUN'

      - name: Parse physical G3 allow and package inventory (NO OWNER HOST EXECUTION)
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            'agent_bridge/scripts/f1_g3_physical_allow_inventory_readonly.ps1',
            [ref]$tokens, [ref]$errors)
          if (@($errors).Count -ne 0) { throw 'STOP: G3 read-only inventory syntax invalid' }
          Write-Host 'G3_PHYSICAL_READONLY_SCRIPT_SYNTAX=PASS'
          Write-Host 'G3_OWNER_HOST_SCAN=NOT_RUN'

      - name: Syntax and changed package tests
        run: |
          python -m py_compile agent_bridge/scripts/build_user_package.py agent_bridge/tests/test_rc1_package.py
          python -m pytest -q agent_bridge/tests/test_rc1_package.py
      - name: Read-only F1 Windows discovery diagnostic (CI host only)
        shell: pwsh
        run: |
          $raw = & pwsh -NoProfile -File agent_bridge/scripts/f1_host_discovery_readonly.ps1
          if ($LASTEXITCODE -ne 0) { throw 'STOP: read-only host diagnostic failed' }
          $j = $raw | ConvertFrom-Json
          if ($j.schema -cne 'FOX2_F1_HOST_DISCOVERY_READ_ONLY_V1' -or
              $j.positive_claim_authority -cne 'DENY' -or
              $j.canary -cne 'HOLD' -or
              $j.durable_legacy_retirement_verified -ne $false -or
              $j.privileged_broker_verified -ne $false) {
            throw 'STOP: host discovery must never self-certify F1 authority'
          }
          Write-Host 'F1_HOST_DISCOVERY_CI_ONLY_READ_ONLY_NO_ADMISSION'
      - name: Full current-source Bridge regression
        run: python -m pytest -q agent_bridge/tests
      - name: Install pinned .NET 8 SDK for ephemeral Windows package build
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build one quarantined source-bound Windows package (not release)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $venv = Join-Path $env:RUNNER_TEMP 'fox2-build-venv'
          py -3.13 -m venv $venv
          if ($LASTEXITCODE -ne 0) { throw 'STOP: isolated build venv unavailable' }
          $buildPython = Join-Path $venv 'Scripts/python.exe'
          & $buildPython -m pip install --disable-pip-version-check 'setuptools>=80,<90' 'wheel>=0.45,<1' 'build>=1,<2' 'jsonschema>=4,<5' 'attrs>=23,<27' 'referencing>=0.35,<1' 'rpds-py>=0.25,<1' 'jsonschema-specifications>=2024,<2030'
          if ($LASTEXITCODE -ne 0) { throw 'STOP: isolated build dependencies unavailable' }
          $archive = Join-Path $env:RUNNER_TEMP 'FOX2_RC1_F0_DENY_CI_QUARANTINE.zip'
          & $buildPython agent_bridge/scripts/build_user_package.py --output $archive --build-python $buildPython
          if ($LASTEXITCODE -ne 0) { throw 'STOP: package build failed' }
          $receipt = [System.IO.Path]::ChangeExtension($archive, '.json')
          if (!(Test-Path -LiteralPath $archive) -or !(Test-Path -LiteralPath $receipt)) {
            throw 'STOP: package or receipt missing'
          }
          $json = Get-Content -LiteralPath $receipt -Raw | ConvertFrom-Json
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -cne $json.sha256) { throw 'STOP: archive SHA mismatch' }
          $head = (git rev-parse HEAD).Trim()
          if ($json.manifest.source_git_commit -cne $head) { throw 'STOP: package source commit mismatch' }
          if (@($json.manifest.files.PSObject.Properties).Count -lt 6) { throw 'STOP: incomplete package file inventory' }
          if (!$json.manifest.wheel_source_modules.'fox2_agent_bridge/ledger.py') {
            throw 'STOP: ledger wheel provenance missing'
          }
          if (!$json.manifest.wheel_source_modules.'fox2_agent_bridge/desktop.py') {
            throw 'STOP: desktop wheel provenance missing'
          }
          if (!$json.manifest.wheel_source_modules.'fox2_agent_bridge/f1_broker_store.py') {
            throw 'STOP: F1 broker storage core missing from wheel inventory'
          }
          if (!$json.manifest.wheel_source_modules.'fox2_agent_bridge/f1_reconcile.py') {
            throw 'STOP: F1 cross-root reconciliation source missing from wheel inventory'
          }
          Write-Host "CI_QUARANTINED_F0_DENY_PACKAGE_SHA256=$actual"
          Write-Host "CI_QUARANTINED_SOURCE_COMMIT=$head"
          Write-Host 'NO_INSTALL_NO_RELEASE_NO_CANARY_NO_POSITIVE_AUTHORITY'
