name: FOX2 Bridge F1 offline code and tests
on:
  push:
    branches:
      - work/FOX2-BRIDGE-F1-CHAT-DIRECT-INTEGRATED-20261021
    paths:
      - 'agent_bridge/**'
      - '.github/workflows/fox2-bridge-f1-offline-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fox2-bridge-f1-offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-windows-tests:
    name: Isolated Windows source validation
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout immutable commit without write token persistence
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Pin Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Report exact source SHA and verify safe workspace
        shell: pwsh
        run: |
          $sha = (git rev-parse HEAD).Trim()
          if ($sha -cne '${{ github.sha }}') { throw 'STOP: Actions source drift' }
          if (git status --porcelain) { throw 'STOP: Checkout not clean' }
          Write-Host "OFFLINE_SOURCE_SHA=$sha"
          Write-Host 'INSTALLED_BRIDGE=NOT_ACCESSED'
      - name: Install offline-test dependencies in runner environment
        run: python -m pip install -e './agent_bridge[dev]'
      - name: Syntax and changed package tests
        run: |
          python -m py_compile agent_bridge/scripts/build_user_package.py agent_bridge/tests/test_rc1_package.py
          python -m pytest -q agent_bridge/tests/test_rc1_package.py
      - name: Full current-source Bridge regression
        run: python -m pytest -q agent_bridge/tests
