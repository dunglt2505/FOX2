name: FOX2 Policy v2 migration CI
on:
  push:
    branches:
      - work/FOX2-POLICY-V200-OWNER-OVERRIDE-RELEASE-20261019
    paths:
      - 'agent_bridge/**'
      - 'docs/governance/FOX2_POLICY_V2.0.0.md'
      - 'docs/governance/FOX2_PROJECT_DICTIONARY_v1.3.json'
      - 'docs/governance/FOX2_AGENT_PROMPT_POLICY_V1_4_0_OWNER_OVERRIDE_ROUTING_INDEX_20261019.md'
      - '.github/workflows/fox2-policy-v2-migration-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fox2-policy-v2-migration-ci
  cancel-in-progress: true

jobs:
  migration-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Read only checkout including immutable dictionary source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install unit test dependencies only
        run: python -m pip install -e './agent_bridge[dev]'
      - name: Pinned dictionary generator --check
        run: python agent_bridge/scripts/generate_project_dictionary.py --check
      - name: Focused source migration, Dictionary and future-version resolver tests
        run: python -m pytest -q agent_bridge/tests/test_policy_v2_source_migration.py agent_bridge/tests/test_project_dictionary.py agent_bridge/tests/test_dictionary_first_source_set.py
      - name: Pinned Dispatch v3 compatibility generator --check
        run: python agent_bridge/scripts/generate_dispatch_schema_v3_contract.py --check

  full-bridge-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Read only checkout including immutable source history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install unit test dependencies only
        run: python -m pip install -e './agent_bridge[dev]'
      - name: Pinned Dictionary/Dispatch generator validation
        shell: pwsh
        run: |
          python agent_bridge/scripts/generate_project_dictionary.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python agent_bridge/scripts/generate_dispatch_schema_v3_contract.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare clean isolated owner-workspace fixture
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force 'C:\Projects' | Out-Null
          if (Test-Path 'C:\Projects\FOX2') { throw 'Owner-workspace fixture path unexpectedly exists' }
          git worktree add --detach 'C:\Projects\FOX2' HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dirty = git -C 'C:\Projects\FOX2' status --porcelain
          if ($LASTEXITCODE -ne 0 -or $dirty) { throw 'Owner-workspace fixture must start clean' }
      - name: Full Bridge regression in Windows CI fixture environment
        run: python -m pytest -q agent_bridge/tests
