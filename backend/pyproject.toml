[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "fox2-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.11,<3", "jsonschema>=4.23,<5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"fox2.contracts" = ["*.schema.json"]
